version: '3.8'
services:
  backend:
    image: python:3.11-slim
    container_name: voltherm-backend
    working_dir: /app
    volumes:
      - ./backend:/app:cached
    ports:
      - "4000:4000"
    environment:
      - AGENT_SERVICE_URL=http://node_agent:5000
      - PORT=4000
    command: bash -c "pip install --no-cache-dir -r requirements.txt && uvicorn main:app --host 0.0.0.0 --port 4000 --reload"

  node_agent:
    image: node:18
    container_name: voltherm-node-agent
    working_dir: /usr/src/app
    volumes:
      - ./backend/node_agent:/usr/src/app:cached
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
    command: bash -lc "npm install --silent && node index.js"

networks:
  default:
    name: voltherm-local
